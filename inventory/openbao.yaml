# Shared product identity: inventory name, upstream GitHub repository and NVD lookup names.
tool:
  name: openbao
  repo: openbao/openbao
  vendor: openbao
  product: openbao

# Tool-wide settings override config.yaml; remove a value to inherit the global setting.
# Credentials stay in environment variables; configure only their variable names here.
config:
  fix_days:
    critical: 2
    high: 7
    medium: 14
    low: 21
    unknown: null
    known_exploited: 2
  scan:
    enabled: true
    dry_run: false
    min_severity: low
    include_unknown_severity: true
    report_unknown_versions: true
    ignore_cves: []
  sources:
    nvd:
      product_search: true
      keyword_search: true
    epss:
      enabled: true
    kev:
      enabled: true
      nvd_fallback: true
  outputs:
    github:
      enabled: true
      repository: null
      token_env: GITHUB_TOKEN
    jira:
      enabled: false
      base_url: ''
      project: ''
      issue_type: Task
      email_env: JIRA_EMAIL
      token_env: JIRA_API_TOKEN
      fields: {}
  notifications:
    slack:
      enabled: false
      webhook_env: SLACK_WEBHOOK_URL
      repeat: false
      state_file: .vuln-watch/slack.json

# Installations to scan independently, each with a stable id, environment, version and ownership.
# Deployment config overrides tool settings; {} inherits them. Keep ids stable across upgrades.
# These are demo records. Legacy unscoped tickets are not automatically migrated.
deployments:
  - id: production
    environment: production
    version: "2.5.5"
    team: sre
    owner: iamunnip
    config: {}
  - id: staging
    environment: staging
    version: "2.6.4"
    team: sre
    owner: iamunnip
    config: {}
