[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "infra-vuln-watch"
version = "0.1.0"
description = "CVE scan of infrastructure inventory"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "packaging==26.3",
    "PyYAML==6.0.3",
    "requests==2.34.2",
]

[project.optional-dependencies]
dev = [
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.3",
    "types-PyYAML==6.0.12.20261103",
    "types-requests==2.33.0.20261030",
]

[project.scripts]
infra-vuln-watch = "infra_vuln_watch.cli.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["infra_vuln_watch"]
branch = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
files = ["src"]
check_untyped_defs = true
