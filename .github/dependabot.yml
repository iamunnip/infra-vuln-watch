version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cache-actions:
        applies-to: version-updates
        patterns:
          - actions/cache
          - actions/cache/*
      cache-actions-security:
        applies-to: security-updates
        patterns:
          - actions/cache
          - actions/cache/*
