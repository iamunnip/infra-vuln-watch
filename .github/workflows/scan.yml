name: scan

on:
  workflow_dispatch:

# Run one scan at a time. Two scans together could open the same new issue twice.
concurrency:
  group: scan
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install .

      - name: Restore Slack delivery receipts
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vuln-watch/
          key: slack-receipts-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            slack-receipts-v1-${{ github.ref_name }}-

      - name: Check inventory against NVD
        run: python -m infra_vuln_watch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Save Slack delivery receipts, including partial successful deliveries
        if: always() && hashFiles('.vuln-watch/**') != ''
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .vuln-watch/
          key: slack-receipts-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
