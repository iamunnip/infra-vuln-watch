name: tests

# Runs when a pull request is opened or updated, not when it is merged.
on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the package and test tools
        run: pip install -e ".[dev]"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install the Mermaid parser
        run: npm ci --ignore-scripts
        working-directory: scripts/mermaid

      - name: Check lint
        run: ruff check src tests scripts

      - name: Check types
        run: mypy

      - name: Run tests
        run: python -m pytest --cov --cov-report=term-missing --cov-fail-under=90

      - name: Check documentation
        run: python scripts/check_docs.py
